# Keep the free Supabase project active with real database queries.
# A few daily requests are more reliable than a single weekly visit.
name: Supabase heartbeat

on:
  schedule:
    # UTC; approximately 09:13, 14:13 and 19:13 Mexico City time.
    - cron: '13 1,15,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query Supabase database
        env:
          SUPABASE_URL: https://rgyhrpgpawjxrmtpughu.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_BrekuPAi2wGGC7lxHQ9rtQ_yGnAdpn1
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 --max-time 25 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/rpc/keepalive_ping")"
          if [[ "$response" != "1" ]]; then
            echo "Unexpected heartbeat response: $response" >&2
            exit 1
          fi
          echo "Supabase heartbeat OK"
