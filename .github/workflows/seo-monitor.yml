name: Monitor SEO public routes

on:
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * *' # 08:15 CDMX UTC-6; GitHub schedule is best effort

permissions:
  contents: read

jobs:
  seo-public-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify live SEO and recent article discovery
        run: python3 scripts/check-live-seo.py
