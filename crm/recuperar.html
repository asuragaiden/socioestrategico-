<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recuperar acceso | Socio Estratégico</title><style>body{margin:0;background:#f3f6fb;color:#172c49;font:16px system-ui,sans-serif}main{max-width:440px;margin:12vh auto;padding:26px;background:white;border:1px solid #dce4ef;border-radius:20px;box-shadow:0 8px 30px #132e4912}h1{font-size:27px}label{display:block;margin:16px 0 7px;font-weight:650}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:10px;font:inherit}input{border:1px solid #bcc9da}button{border:0;background:#1769ed;color:white;font-weight:700;margin-top:18px}button:disabled{opacity:.6}p{line-height:1.5}#message{min-height:24px}a{color:#1769ed}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script></head><body><main><h1>Establece tu contraseña</h1><p>Acceso privado al CRM de Socio Estratégico.</p><div id="loading">Validando el enlace de recuperación…</div><form id="form" hidden><label for="pass">Nueva contraseña</label><input id="pass" type="password" minlength="12" autocomplete="new-password" required placeholder="Mínimo 12 caracteres"><label for="confirm">Confirmar contraseña</label><input id="confirm" type="password" minlength="12" autocomplete="new-password" required><button type="submit">Guardar contraseña</button></form><p id="message" role="status"></p><p><a href="/crm/">Volver al CRM</a></p></main><script>
(async()=>{'use strict';const db=window.supabase.createClient('https://rgyhrpgpawjxrmtpughu.supabase.co','sb_publishable_BrekuPAi2wGGC7lxHQ9rtQ_yGnAdpn1',{auth:{detectSessionInUrl:true}}),$=s=>document.querySelector(s);let recovery=false;db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;$('#loading').hidden=true;$('#form').hidden=false;}});const params=new URLSearchParams(location.search);const code=params.get('code');if(code){const {error}=await db.auth.exchangeCodeForSession(code);if(error){$('#loading').textContent='Este enlace no es válido o expiró. Solicita uno nuevo desde el CRM.';return;}recovery=true;}const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('error')){$('#loading').textContent='El enlace no es válido o expiró. Solicita uno nuevo.';return;}const {data}=await db.auth.getSession();if(data.session){$('#loading').hidden=true;$('#form').hidden=false;}else{setTimeout(()=>{if(!recovery){$('#loading').textContent='No se detectó una sesión válida. Solicita otro enlace de recuperación.';}},1500)}$('#form').onsubmit=async e=>{e.preventDefault();const a=$('#pass').value,b=$('#confirm').value;if(a!==b){$('#message').textContent='Las contraseñas no coinciden.';return;}const btn=$('#form button');btn.disabled=true;const {error}=await db.auth.updateUser({password:a});btn.disabled=false;if(error){$('#message').textContent='No se pudo actualizar: '+error.message;return;}$('#form').hidden=true;$('#message').textContent='Contraseña actualizada. Ya puedes entrar al CRM.';await db.auth.signOut();};
})();
</script></body></html>
